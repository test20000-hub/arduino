<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아두이노 실습 대시보드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- 지구본 파비콘 방지용 이모지 파비콘 -->
    <link rel="icon" href="https://fav.farm/🤖">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- 상단 헤더 -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-cyan-500/10 border border-cyan-500/30 rounded-xl text-cyan-400">
                    <i class="fa-solid fa-microchip text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">아두이노 정보·전자공학 실습</h1>
                    <p class="text-xs text-slate-400">수업 및 과제 수행을 위한 빠른 이동 센타</p>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 링크 카드리스트 -->
    <main class="max-w-5xl mx-auto px-4 py-12 w-full flex-1 flex flex-col justify-center">
        <div class="text-center mb-10">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">원하는 메뉴를 선택하세요</h2>
            <p class="text-sm text-slate-400">구글 클래스룸, 틴커캐드 회로 설계, 과제 정답 확인 페이지로 이동합니다.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- 1. 구글 클래스룸 -->
            <a href="https://classroom.google.com/c/ODcyMDYwNjQxNDY5" target="_blank" rel="noopener noreferrer" 
               class="group bg-slate-900 border border-slate-800 hover:border-emerald-500/50 p-6 rounded-2xl transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-emerald-500/10 flex flex-col justify-between">
                <div>
                    <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1 group-hover:text-emerald-400 transition-colors">구글 클래스룸</h3>
                    <p class="text-xs text-slate-400 leading-relaxed">수업 자료 확인 및 과제 제출을 위한 클래스룸 바로가기</p>
                </div>
                <div class="mt-6 text-xs font-semibold text-emerald-400 flex items-center gap-1">
                    바로가기 <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                </div>
            </a>

            <!-- 2. 틴커캐드 -->
            <a href="https://www.tinkercad.com/dashboard/designs/circuits" target="_blank" rel="noopener noreferrer" 
               class="group bg-slate-900 border border-slate-800 hover:border-amber-500/50 p-6 rounded-2xl transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-amber-500/10 flex flex-col justify-between">
                <div>
                    <div class="w-12 h-12 bg-amber-500/10 border border-amber-500/30 text-amber-400 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-cubes"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1 group-hover:text-amber-400 transition-colors">틴커캐드 회로 시뮬레이터</h3>
                    <p class="text-xs text-slate-400 leading-relaxed">온라인 아두이노 회로 구성 및 코드 실습 환경 이동</p>
                </div>
                <div class="mt-6 text-xs font-semibold text-amber-400 flex items-center gap-1">
                    바로가기 <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                </div>
            </a>

            <!-- 3. 아두이노 정답 센터 -->
            <a href="./answer.html" 
               class="group bg-slate-900 border border-slate-800 hover:border-cyan-500/50 p-6 rounded-2xl transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-cyan-500/10 flex flex-col justify-between">
                <div>
                    <div class="w-12 h-12 bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 rounded-xl flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1 group-hover:text-cyan-400 transition-colors">과제 3-2 정답 센터</h3>
                    <p class="text-xs text-slate-400 leading-relaxed">회로 분석 & 코드 문항별 정답 자동 조회 및 자가진단</p>
                </div>
                <div class="mt-6 text-xs font-semibold text-cyan-400 flex items-center gap-1">
                    정답 확인하기 <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                </div>
            </a>

        </div>
    </main>

    <!-- 하단 푸터 -->
    <footer class="border-t border-slate-800 bg-slate-900 py-6 text-center text-xs text-slate-500">
        <p>아두이노 정보·전자공학 실습 포털</p>
    </footer>

</body>
</html>
