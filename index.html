                question: '18번 줄 `digitalWrite(6, HIGH);`의 실행 효과와 작성 의도는?',
                answer: '- 효과: 6번 핀으로 5V(HIGH)를 출력하여 LED를 켠다.\n- 작성 의도: 오른쪽 스위치가 눌렸을 때 오른쪽 LED를 켜서 눌림 반응을 시각적으로 확인시켜 주기 위함.',
                explanation: '오른쪽 LED 제어 명령'
            },
            {
                id: 27,
                category: 'logic',
                tag: 'if-else/제어문',
                question: '20번 줄 빈칸 채우기: "else 문이 오기 위해서는 반드시 위에서 (OO)문이 있고 (O)일 때 해야 할 일의 기술이 끝난 상태여야 한다."',
                answer: 'OO = if, O = 참 / e자 위치는 if문의 i자 및 참 실행끝 중괄호 }와 같은 열',
                explanation: 'if-else 문법 세트 조건 규칙'
            },
            {
                id: 28,
                category: 'logic',
                tag: 'if-else/제어문',
                question: '21번 줄 `digitalWrite(6, LOW);`는 어떤 경우에 실행되는가?',
                answer: '오른쪽 스위치가 눌리지 않아(`swR`이 HIGH상태) 17번 if문 조건이 거짓이 되었을 때 else 구문에 의해 실행된다. (의도: 스위치를 떼면 LED를 끄기 위함)',
                explanation: '스위치 해제 시 LED 오프 처리'
            },
            {
                id: 29,
                category: 'logic',
                tag: 'if-else/제어문',
                question: '23번 줄 `if( )` 괄호 안에 들어가야 할 식과 그 이유는?',
                answer: '`swL == LOW` (이유: 위쪽 17~22번 줄은 오른쪽 스위치를 검사했으므로, 23번 줄부터는 왼쪽 스위치 상태를 검사해야 함)',
                explanation: '왼쪽 스위치 동작 검사'
            },
            {
                id: 30,
                category: 'logic',
                tag: 'if-else/제어문',
                question: '24번 줄 `digitalWrite( , HIGH);`에서 콤마(,) 앞에 들어갈 핀 번호와 의미는?',
                answer: '8 (의도: 왼쪽 스위치가 눌렸을 때 대응하는 8번 핀의 왼쪽 LED를 켜기 위함)',
                mistakeNote: '★ 주의: 7번이 아니라 8번 핀입니다!'
            },
            {
                id: 31,
                category: 'logic',
                tag: 'if-else/제어문',
                question: '26~28번 줄 `else { digitalWrite(8, LOW); }`의 전체적인 의미는?',
                answer: '왼쪽 스위치를 누르지 않았을 때(if조건 거짓), 8번 핀 출력을 LOW(0V)로 만들어 왼쪽 LED를 끄는 동작이다.',
                explanation: '왼쪽 LED 오프 처리'
            }
        ];

        let currentMode = 'all';
        let currentCategory = 'all';
        let searchQuery = '';
        let checkedMap = {};

        function renderQAList() {
            const container = document.getElementById('qaContainer');
            container.innerHTML = '';

            const filteredData = qaData.filter(item => {
                const matchesCat = (currentCategory === 'all') || (item.category === currentCategory);
                const query = searchQuery.toLowerCase();
                const matchesSearch = item.question.toLowerCase().includes(query) ||
                                      item.answer.toLowerCase().includes(query) ||
                                      item.tag.toLowerCase().includes(query) ||
                                      String(item.id).includes(query);
                return matchesCat && matchesSearch;
            });

            document.getElementById('totalCount').innerText = filteredData.length;

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-slate-900 rounded-2xl border border-slate-800 text-slate-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-3 text-slate-600"></i>
                        <p class="text-sm font-medium">검색 결과 또는 해당하는 문항이 없습니다.</p>
                    </div>
                `;
                return;
            }

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-slate-700 transition-all duration-200 shadow-md relative";

                const isChecked = checkedMap[item.id] || false;

                let tagBg = "bg-slate-800 text-slate-300 border-slate-700";
                if(item.category === 'circuit') tagBg = "bg-emerald-500/10 text-emerald-400 border-emerald-500/30";
                if(item.category === 'syntax') tagBg = "bg-blue-500/10 text-blue-400 border-blue-500/30";
                if(item.category === 'function') tagBg = "bg-purple-500/10 text-purple-400 border-purple-500/30";
                if(item.category === 'logic') tagBg = "bg-amber-500/10 text-amber-400 border-amber-500/30";

                let bodyHtml = '';

                if (currentMode === 'all') {
                    bodyHtml = `
                        <div class="flex items-start justify-between gap-3 mb-3">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-md border ${tagBg}">
                                Q${item.id}. ${item.tag}
                            </span>
                        </div>
                        <h3 class="text-base font-semibold text-slate-100 mb-3 leading-relaxed">
                            ${formatCodeSnippets(item.question)}
                        </h3>
                        
                        <div class="bg-slate-950 rounded-xl border border-slate-800 p-4 space-y-2 mb-3">
                            <div class="text-xs font-bold text-cyan-400 flex items-center gap-1.5">
                                <i class="fa-solid fa-check-circle"></i> 모범 답안
                            </div>
                            <div class="text-sm text-slate-200 whitespace-pre-line leading-relaxed font-medium">
                                ${formatCodeSnippets(item.answer)}
                            </div>
                        </div>

                        ${item.explanation ? `
                            <p class="text-xs text-slate-400 flex items-start gap-1.5 pt-1">
                                <i class="fa-solid fa-circle-info text-slate-500 mt-0.5"></i>
                                <span><strong>해설:</strong> ${item.explanation}</span>
                            </p>
                        ` : ''}

                        ${item.mistakeNote ? `
                            <div class="mt-2 text-xs text-rose-300 bg-rose-950/40 border border-rose-800/50 p-2.5 rounded-lg flex items-center gap-2">
                                <i class="fa-solid fa-triangle-exclamation text-rose-400"></i>
                                <span>${item.mistakeNote}</span>
                            </div>
                        ` : ''}
                    `;
                } else {
                    bodyHtml = `
                        <div class="flex items-start justify-between gap-3 mb-3">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-md border ${tagBg}">
                                Q${item.id}. ${item.tag}
                            </span>
                            <button onclick="toggleCheck(${item.id})" class="text-xs font-semibold px-3 py-1 rounded-lg transition-all ${isChecked ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400 border border-slate-700 hover:text-white'}">
                                ${isChecked ? '<i class="fa-solid fa-check"></i> 학습완료' : '학습 완료 표시'}
                            </button>
                        </div>
                        <h3 class="text-base font-semibold text-slate-100 mb-4 leading-relaxed">
                            ${formatCodeSnippets(item.question)}
                        </h3>

                        <div id="quizBox_${item.id}" class="bg-slate-950 rounded-xl border border-dashed border-slate-700 p-4 text-center cursor-pointer hover:border-cyan-500/50 transition-all" onclick="revealAnswer(${item.id})">
                            <div id="quizPrompt_${item.id}" class="text-xs text-slate-400 py-2">
                                <i class="fa-solid fa-eye mr-1 text-cyan-400"></i> 클릭하여 모범 답안 및 해설 확인하기
                            </div>
                            <div id="quizContent_${item.id}" class="hidden text-left space-y-2">
                                <div class="text-xs font-bold text-cyan-400 flex items-center gap-1.5">
                                    <i class="fa-solid fa-check-circle"></i> 정답 확인
                                </div>
                                <div class="text-sm text-slate-200 whitespace-pre-line leading-relaxed font-medium">
                                    ${formatCodeSnippets(item.answer)}
                                </div>
                                ${item.explanation ? `<p class="text-xs text-slate-400 pt-2 border-t border-slate-800"><strong>해설:</strong> ${item.explanation}</p>` : ''}
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = bodyHtml;
                container.appendChild(card);
            });

            updateQuizProgress();
        }

        function formatCodeSnippets(text) {
            return text.replace(/`([^`]+)`/g, '<code class="code-font bg-slate-800 text-cyan-300 px-1.5 py-0.5 rounded border border-slate-700 text-xs">$1</code>');
        }

        function setMode(mode) {
            currentMode = mode;
            const btnAll = document.getElementById('btnViewAll');
            const btnQuiz = document.getElementById('btnViewQuiz');
            const quizScoreBox = document.getElementById('quizScoreBox');

            if (mode === 'all') {
                btnAll.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-semibold rounded-lg transition-all duration-200 bg-cyan-500 text-slate-950 shadow";
                btnQuiz.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-semibold text-slate-400 rounded-lg hover:text-white transition-all duration-200";
                quizScoreBox.classList.add('hidden');
            } else {
                btnQuiz.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-semibold rounded-lg transition-all duration-200 bg-cyan-500 text-slate-950 shadow";
                btnAll.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-semibold text-slate-400 rounded-lg hover:text-white transition-all duration-200";
                quizScoreBox.classList.remove('hidden');
            }
            renderQAList();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.className = "cat-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/40";
                } else {
                    btn.className = "cat-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-400 hover:bg-slate-700";
                }
            });
            renderQAList();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            renderQAList();
        }

        function revealAnswer(id) {
            const prompt = document.getElementById(`quizPrompt_${id}`);
            const content = document.getElementById(`quizContent_${id}`);
            const box = document.getElementById(`quizBox_${id}`);

            if (prompt && content && box) {
                prompt.classList.add('hidden');
                content.classList.remove('hidden');
                box.classList.remove('border-dashed', 'text-center');
                box.classList.add('border-solid', 'border-slate-800');
            }
        }

        function toggleCheck(id) {
            checkedMap[id] = !checkedMap[id];
            renderQAList();
        }

        function updateQuizProgress() {
            const checkedCount = Object.values(checkedMap).filter(Boolean).length;
            document.getElementById('checkedCount').innerText = checkedCount;
            document.getElementById('quizTotalCount').innerText = qaData.length;
        }

        window.onload = function() {
            renderQAList();
        };
    </script>
</body>
</html>
