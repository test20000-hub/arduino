<script>
    let ddays = [];
    let currentIndex = 0;

    // GitHub에 올라간 ddays.json 파일에서 데이터 읽어오기 (DB 역할)
    async function loadDDaysFromGithub() {
        try {
            // 캐시 방지를 위해 타임스탬프(?t=...) 추가
            const response = await fetch(`./ddays.json?t=${new Date().getTime()}`);
            if (response.ok) {
                ddays = await response.json();
            } else {
                console.error("ddays.json 불러오기 실패");
            }
        } catch (error) {
            console.error("네트워크 오류:", error);
        } finally {
            renderDDay(); // 데이터 로드 후 D-Day 출력
        }
    }

    // 모달 및 토스트 관련 함수
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function copySnippet(text) {
        navigator.clipboard.writeText(text).then(() => {
            showToast(`코드 [ ${text} ] 이(가) 복사되었습니다.`);
        });
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        toastMsg.innerText = msg;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        setTimeout(() => {
            toast.classList.add('opacity-0', 'pointer-events-none');
        }, 2000);
    }

    // 1. 만료된 D-Day 필터링
    function filterExpiredDDays() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        ddays = ddays.filter(item => {
            const target = new Date(item.date + 'T00:00:00');
            const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
            return diffDays >= 0; // 지남(음수) 제거
        });
    }

    // 2. D-Day 렌더링
    function renderDDay() {
        filterExpiredDDays();

        const wrapper = document.getElementById('dday-wrapper');
        if (!ddays || ddays.length === 0) {
            wrapper.classList.add('hidden');
            return;
        }

        wrapper.classList.remove('hidden');

        if (currentIndex >= ddays.length) {
            currentIndex = 0;
        }

        // 화살표 버튼 제어
        const prevBtn = document.getElementById('dday-prev-btn');
        const nextBtn = document.getElementById('dday-next-btn');
        if (ddays.length <= 1) {
            prevBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
        } else {
            prevBtn.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
        }

        const current = ddays[currentIndex];
        const target = new Date(current.date + 'T00:00:00');
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));

        const card = document.getElementById('dday-card');
        const iconBox = document.getElementById('dday-icon-box');
        const title = document.getElementById('dday-title');
        const targetText = document.getElementById('dday-target-text');
        const badge = document.getElementById('dday-badge');
        const counter = document.getElementById('dday-counter');

        title.innerText = current.title;
        targetText.innerText = `${current.date} 까지`;
        counter.innerText = `${currentIndex + 1}/${ddays.length}`;

        // 남은 일수 색상 변경 스타일
        if (diffDays >= 7) {
            card.className = "relative border border-emerald-500/30 bg-gradient-to-r from-emerald-500/10 via-slate-900 to-emerald-500/10 rounded-2xl p-4 sm:p-5 flex items-center justify-between shadow-lg shadow-emerald-500/5 min-h-[90px]";
            iconBox.className = "w-10 h-10 bg-emerald-500/20 border border-emerald-500/40 rounded-xl flex items-center justify-center text-emerald-400 shrink-0";
            title.className = "text-xs font-semibold text-emerald-400 tracking-wider uppercase";
            badge.innerText = `D-${diffDays}`;
            badge.className = "bg-emerald-500 text-slate-950 font-black text-lg sm:text-xl px-5 py-2 rounded-xl shadow-md shrink-0";
        } else if (diffDays >= 3) {
            card.className = "relative border border-amber-500/30 bg-gradient-to-r from-amber-500/10 via-slate-900 to-amber-500/10 rounded-2xl p-4 sm:p-5 flex items-center justify-between shadow-lg shadow-amber-500/5 min-h-[90px]";
            iconBox.className = "w-10 h-10 bg-amber-500/20 border border-amber-500/40 rounded-xl flex items-center justify-center text-amber-400 shrink-0";
            title.className = "text-xs font-semibold text-amber-400 tracking-wider uppercase";
            badge.innerText = `D-${diffDays}`;
            badge.className = "bg-amber-500 text-slate-950 font-black text-lg sm:text-xl px-5 py-2 rounded-xl shadow-md shrink-0";
        } else {
            card.className = "relative border border-rose-500/40 bg-gradient-to-r from-rose-500/15 via-slate-900 to-rose-500/15 rounded-2xl p-4 sm:p-5 flex items-center justify-between shadow-lg shadow-rose-500/10 min-h-[90px]";
            iconBox.className = "w-10 h-10 bg-rose-500/20 border border-rose-500/40 rounded-xl flex items-center justify-center text-rose-400 shrink-0";
            title.className = "text-xs font-semibold text-rose-400 tracking-wider uppercase";
            badge.innerText = diffDays === 0 ? "D-DAY" : `D-${diffDays}`;
            badge.className = "bg-rose-500 text-white font-black text-lg sm:text-xl px-5 py-2 rounded-xl shadow-md shrink-0 animate-pulse";
        }
    }

    function prevDDay() {
        if (ddays.length === 0) return;
        currentIndex = (currentIndex - 1 + ddays.length) % ddays.length;
        renderDDay();
    }

    function nextDDay() {
        if (ddays.length === 0) return;
        currentIndex = (currentIndex + 1) % ddays.length;
        renderDDay();
    }

    // 페이지 진입 시 GitHub JSON 읽기 실행
    loadDDaysFromGithub();
</script>
