<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-Day 관리자 센터</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans KR',sans-serif}input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;filter:invert(.8)}</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
<header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50"><div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between"><div class="flex items-center space-x-3"><i class="fa-solid fa-gear text-cyan-400 text-xl"></i><h1 class="text-lg font-bold text-white">D-Day 관리자 센터</h1></div><a href="./index.html" class="text-xs text-slate-400 hover:text-white flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> 메인으로 돌아가기</a></div></header>
<div id="login-section" class="max-w-md mx-auto my-auto px-4 py-8 w-full"><div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center"><div class="w-12 h-12 bg-cyan-500/10 border border-cyan-500/30 rounded-xl flex items-center justify-center mx-auto mb-4 text-cyan-400 text-xl"><i class="fa-solid fa-lock"></i></div><h2 class="text-lg font-bold text-white mb-1">관리자 인증</h2><p class="text-xs text-slate-400 mb-6">관리자 인증과 GitHub 연동은 서버에서 처리됩니다.</p><form onsubmit="handleLogin(event)" class="space-y-4"><input type="password" id="admin-pass-input" autocomplete="current-password" placeholder="관리자 비밀번호" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500 text-center"><button type="submit" id="login-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm py-3 rounded-xl transition-all shadow-lg shadow-cyan-500/20">로그인</button></form></div></div>
<main id="admin-main-section" class="max-w-4xl mx-auto px-4 py-8 w-full flex-1 space-y-6 hidden">
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl"><h2 class="text-sm font-bold text-cyan-400 flex items-center gap-2 mb-2"><i class="fa-brands fa-github"></i> 안전한 GitHub 연동</h2><p class="text-xs text-slate-400">GitHub 저장소 정보와 Personal Access Token은 서버 환경변수로 관리합니다. 브라우저에는 PAT를 저장하거나 노출하지 않습니다.</p><div id="connection-status" class="mt-4 text-xs text-slate-500">서버 연결 상태 확인 중...</div></div>
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl"><h2 class="text-sm font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-toggle-on text-cyan-400"></i> 빠른 이동 카드 노출 설정</h2><div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
<div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="font-semibold text-slate-200">구글 드라이브</span><input type="checkbox" id="toggle-drive" checked></div>
<div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="font-semibold text-slate-200">구글 클래스룸</span><input type="checkbox" id="toggle-classroom" checked></div>
<div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="font-semibold text-slate-200">틴커캐드</span><input type="checkbox" id="toggle-tinkercad" checked></div>
<div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="font-semibold text-slate-200">과제 정답 센터</span><input type="checkbox" id="toggle-answer" checked></div>
</div></div>
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl"><h2 class="text-sm font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-plus text-emerald-400"></i> 새 D-Day 일정 추가</h2><div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs"><div><label class="block text-slate-400 mb-1">일정 제목</label><input type="text" id="new-title" placeholder="예: 수행평가 2차 제출" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white"></div><div><label class="block text-slate-400 mb-1">마감 날짜</label><input type="date" id="new-date" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white"></div><div><label class="block text-slate-400 mb-1">마감 교시</label><select id="new-time" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white"><option value="1교시">1교시 시작 전</option><option value="2교시">2교시 시작 전</option><option value="3교시">3교시 시작 전</option><option value="4교시">4교시 시작 전</option><option value="5교시">5교시 시작 전</option><option value="6교시">6교시 시작 전</option><option value="7교시" selected>7교시 마감 (종례 전)</option><option value="자율(24시)">자정 (23:59) 마감</option></select></div></div><button onclick="addDDay()" class="mt-4 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl">목록에 추가하기</button></div>
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl"><div class="flex items-center justify-between mb-4"><h2 class="text-sm font-bold text-white"><i class="fa-solid fa-list-check text-cyan-400 mr-2"></i>등록된 D-Day 목록</h2><button onclick="loadData()" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg">새로고침</button></div><div id="dday-list-box" class="space-y-2 text-xs"><p class="text-slate-500 text-center py-4">불러오는 중...</p></div><div class="mt-6 pt-4 border-t border-slate-800 flex justify-end"><button onclick="saveAll()" id="save-btn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm px-6 py-3 rounded-xl"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>GitHub DB에 전체 설정 저장</button></div></div>
</main>
<footer class="border-t border-slate-800 bg-slate-900 py-6 text-center text-xs text-slate-500"><p>군포중앙고등학교 정보수업 관리자 페이지</p></footer><div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white text-xs px-4 py-3 rounded-xl border border-slate-700 shadow-2xl opacity-0 pointer-events-none"><span id="toast-msg"></span></div>
<script>
const API='./api/github';let adminPassword='',ddays=[];
async function apiRequest(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action,password:adminPassword,...payload})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`요청 실패 (${r.status})`);return d}
async function handleLogin(e){e.preventDefault();const input=document.getElementById('admin-pass-input'),button=document.getElementById('login-btn'),password=input.value;if(!password)return;button.disabled=true;button.textContent='확인 중...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'인증 실패');adminPassword=password;document.getElementById('login-section').classList.add('hidden');document.getElementById('admin-main-section').classList.remove('hidden');document.getElementById('connection-status').innerHTML='<span class="text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i>인증 완료 · GitHub PAT는 서버에서만 관리됩니다.</span>';await loadData()}catch(err){alert(err.message);input.value=''}finally{button.disabled=false;button.textContent='로그인'}}
async function loadData(){try{const d=await apiRequest('read');ddays=Array.isArray(d.ddays)?d.ddays:[];const s=d.settings||{};for(const k of ['drive','classroom','tinkercad','answer'])document.getElementById('toggle-'+k).checked=s[k]??true;renderList()}catch(err){document.getElementById('dday-list-box').innerHTML=`<p class="text-rose-400 text-center py-4">${escapeHtml(err.message)}</p>`}}
function renderList(){const b=document.getElementById('dday-list-box');if(!ddays.length){b.innerHTML='<p class="text-slate-500 text-center py-4">등록된 D-Day 일정이 없습니다.</p>';return}b.innerHTML=ddays.map((x,i)=>`<div class="bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between"><div><span class="font-bold text-white">${escapeHtml(x.title)}</span><span class="text-amber-400 ml-2">[${escapeHtml(x.time||'7교시')}]</span><span class="text-slate-400 ml-1">(${escapeHtml(x.date)} 까지)</span></div><button onclick="deleteDDay(${i})" class="text-rose-400 p-1"><i class="fa-solid fa-trash-can"></i> 삭제</button></div>`).join('')}
function addDDay(){const title=document.getElementById('new-title').value.trim(),date=document.getElementById('new-date').value,time=document.getElementById('new-time').value;if(!title||!date){alert('제목과 날짜를 지정해주세요.');return}ddays.push({title,date,time});renderList();document.getElementById('new-title').value='';document.getElementById('new-date').value='';showToast('목록에 추가되었습니다.')}
function deleteDDay(i){ddays.splice(i,1);renderList()}
async function saveAll(){const b=document.getElementById('save-btn');b.disabled=true;b.textContent='GitHub DB 저장 중...';const settings={drive:document.getElementById('toggle-drive').checked,classroom:document.getElementById('toggle-classroom').checked,tinkercad:document.getElementById('toggle-tinkercad').checked,answer:document.getElementById('toggle-answer').checked};try{await apiRequest('save',{ddays,settings});showToast('✅ GitHub에 저장되었습니다.')}catch(err){alert(err.message)}finally{b.disabled=false;b.innerHTML='<i class="fa-solid fa-cloud-arrow-up mr-2"></i>GitHub DB에 전체 설정 저장'}}
function showToast(m){const t=document.getElementById('toast');document.getElementById('toast-msg').innerText=m;t.classList.remove('opacity-0','pointer-events-none');setTimeout(()=>t.classList.add('opacity-0','pointer-events-none'),3000)}function escapeHtml(v){return String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
