<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Day 관리자 센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- 헤더 -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-gear text-cyan-400 text-xl"></i>
                <h1 class="text-lg font-bold text-white">D-Day 관리자 센터</h1>
            </div>
            <a href="./index.html" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> 메인으로 돌아가기
            </a>
        </div>
    </header>

    <!-- 1. 관리자 로그인 모달/상자 (접속 시 표시) -->
    <div id="login-section" class="max-w-md mx-auto my-auto px-4 py-8 w-full">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center">
            <div class="w-12 h-12 bg-cyan-500/10 border border-cyan-500/30 rounded-xl flex items-center justify-center mx-auto mb-4 text-cyan-400 text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-lg font-bold text-white mb-1">관리자 인증</h2>
            <p class="text-xs text-slate-400 mb-6">수행평가 D-Day 관리를 위해 비밀번호를 입력하세요.</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="admin-pass-input" placeholder="비밀번호 입력" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500 text-center">
                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm py-3 rounded-xl transition-all shadow-lg shadow-cyan-500/20">
                    로그인
                </button>
            </form>
        </div>
    </div>

    <!-- 2. 관리자 메인 컨텐츠 (로그인 성공 시 표시) -->
    <main id="admin-main-section" class="max-w-4xl mx-auto px-4 py-8 w-full flex-1 space-y-6 hidden">

        <!-- A. GitHub 연동 설정 카드 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-brands fa-github"></i> GitHub 연동 설정 (DB 연결)
                </h2>
                <button onclick="toggleGithubConfig()" class="text-xs text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-sliders mr-1"></i> <span id="config-toggle-text">접기/열기</span>
                </button>
            </div>
            
            <div id="github-config-box" class="space-y-4 pt-2">
                <p class="text-xs text-slate-400">
                    GitHub API를 통해 <code class="text-amber-300">ddays.json</code> 파일(DB)을 수정합니다. 설정 정보는 브라우저에 자동 저장됩니다.
                </p>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                    <div>
                        <label class="block text-slate-400 mb-1">GitHub 아이디 (Owner)</label>
                        <input type="text" id="gh-owner" placeholder="예: github-username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">저장소 이름 (Repo)</label>
                        <input type="text" id="gh-repo" placeholder="예: info-class-2026" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Personal Access Token</label>
                        <input type="password" id="gh-token" placeholder="ghp_..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    </div>
                </div>
                <button onclick="saveConfig()" class="bg-slate-800 hover:bg-slate-700 text-xs px-4 py-2 rounded-xl text-slate-200 transition-colors">
                    연동 설정 정보 저장하기
                </button>
            </div>
        </div>

        <!-- B. 새 D-Day 추가 폼 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-sm font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-plus text-emerald-400"></i> 새 D-Day 일정 추가
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">일정 제목</label>
                    <input type="text" id="new-title" placeholder="예: 수행평가 2차 제출" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">마감 날짜</label>
                    <input type="date" id="new-date" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <button onclick="addDDay()" class="mt-4 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-colors">
                목록에 추가하기
            </button>
        </div>

        <!-- C. 현재 등록된 D-Day 목록 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-cyan-400"></i> 등록된 D-Day 목록
                </h2>
                <button onclick="fetchFromGithub()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300">
                    <i class="fa-solid fa-rotate-right mr-1"></i> GitHub DB에서 불러오기
                </button>
            </div>

            <div id="dday-list-box" class="space-y-2 text-xs">
                <p class="text-slate-500 text-center py-4">GitHub에서 불러오는 중...</p>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-800 flex justify-end">
                <button onclick="commitToGithub()" id="save-btn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm px-6 py-3 rounded-xl transition-all shadow-lg shadow-cyan-500/20 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> GitHub DB에 최종 저장
                </button>
            </div>
        </div>

    </main>

    <!-- 푸터 -->
    <footer class="border-t border-slate-800 bg-slate-900 py-6 text-center text-xs text-slate-500">
        <p>군포중앙고등학교 정보수업 관리자 페이지</p>
    </footer>

    <!-- 알림 토스트 -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white text-xs px-4 py-3 rounded-xl border border-slate-700 shadow-2xl opacity-0 pointer-events-none transition-all duration-300">
        <span id="toast-msg">성공적으로 처리되었습니다.</span>
    </div>

    <script>
        // 🔑 관리자 비밀번호 설정 (원하는 비밀번호로 수정하세요)
        const ADMIN_PASSWORD = "0511";

        let ddays = [];
        let fileSha = "";

        // 로그인 처리
        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-main-section').classList.remove('hidden');
                initAdmin();
            } else {
                alert("비밀번호가 올바르지 않습니다.");
                document.getElementById('admin-pass-input').value = '';
            }
        }

        // 초기화
        function initAdmin() {
            document.getElementById('gh-owner').value = localStorage.getItem('gh_owner') || '';
            document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
            document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';

            if (localStorage.getItem('gh_owner') && localStorage.getItem('gh_repo') && localStorage.getItem('gh_token')) {
                fetchFromGithub();
            } else {
                document.getElementById('dday-list-box').innerHTML = `<p class="text-amber-400 text-center py-4">상단의 GitHub 연동 설정을 완료해 주세요.</p>`;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3000);
        }

        function toggleGithubConfig() {
            const box = document.getElementById('github-config-box');
            box.classList.toggle('hidden');
        }

        function saveConfig() {
            const owner = document.getElementById('gh-owner').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();

            localStorage.setItem('gh_owner', owner);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            showToast("GitHub 연동 정보가 저장되었습니다.");
            fetchFromGithub();
        }

        // GitHub DB 읽기
        async function fetchFromGithub() {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            if (!owner || !repo || !token) return;

            try {
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/ddays.json`;
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });

                if (response.ok) {
                    const data = await response.json();
                    fileSha = data.sha;
                    const content = decodeURIComponent(escape(atob(data.content)));
                    ddays = JSON.parse(content);
                    renderList();
                    showToast("GitHub DB에서 데이터를 불러왔습니다.");
                } else if (response.status === 404) {
                    ddays = [];
                    fileSha = "";
                    renderList();
                    showToast("ddays.json 파일이 없습니다. 새 일정을 저장하면 파일이 생성됩니다.");
                } else {
                    showToast("GitHub 데이터를 불러오지 못했습니다. 설정 정보를 확인하세요.");
                }
            } catch (err) {
                console.error(err);
                showToast("네트워크 오류가 발생했습니다.");
            }
        }

        function renderList() {
            const listBox = document.getElementById('dday-list-box');
            if (!ddays || ddays.length === 0) {
                listBox.innerHTML = `<p class="text-slate-500 text-center py-4">등록된 D-Day 일정이 없습니다.</p>`;
                return;
            }

            listBox.innerHTML = ddays.map((item, index) => `
                <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
                    <div>
                        <span class="font-bold text-white text-sm">${item.title}</span>
                        <span class="text-slate-400 text-xs ml-2">(${item.date} 까지)</span>
                    </div>
                    <button onclick="deleteDDay(${index})" class="text-rose-400 hover:text-rose-300 p-1">
                        <i class="fa-solid fa-trash-can"></i> 삭제
                    </button>
                </div>
            `).join('');
        }

        function addDDay() {
            const title = document.getElementById('new-title').value.trim();
            const date = document.getElementById('new-date').value;

            if (!title || !date) {
                alert("제목과 날짜를 입력해 주세요.");
                return;
            }

            ddays.push({ title, date });
            renderList();

            document.getElementById('new-title').value = '';
            document.getElementById('new-date').value = '';
            showToast("목록에 추가되었습니다. 하단 저장 버튼을 눌러주세요.");
        }

        function deleteDDay(index) {
            ddays.splice(index, 1);
            renderList();
        }

        // GitHub DB 원격 저장 (Commit)
        async function commitToGithub() {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            if (!owner || !repo || !token) {
                alert("GitHub 연동 정보를 먼저 설정 및 저장해주세요.");
                return;
            }

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.innerText = "GitHub DB 업로드 중...";

            try {
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/ddays.json`;
                const jsonString = JSON.stringify(ddays, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

                const bodyData = {
                    message: "Update ddays.json via Admin Panel",
                    content: encodedContent
                };
                if (fileSha) bodyData.sha = fileSha;

                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (response.ok) {
                    const result = await response.json();
                    fileSha = result.content.sha;
                    showToast("✅ 성공! GitHub DB에 저장되었습니다.");
                } else {
                    const errorErr = await response.json();
                    alert("저장 실패: " + (errorErr.message || "권한 또는 설정 문제"));
                }
            } catch (err) {
                console.error(err);
                alert("네트워크 오류가 발생했습니다.");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> GitHub DB에 최종 저장`;
            }
        }
    </script>
</body>
</html>
