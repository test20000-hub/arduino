<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Day 관리자 센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; filter: invert(0.8); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- 헤더 -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-gear text-cyan-400 text-xl"></i>
                <h1 class="text-lg font-bold text-white">D-Day 관리자 센터</h1>
            </div>
            <a href="./index.html" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> 메인으로 돌아가기
            </a>
        </div>
    </header>

    <!-- 1. 로그인 섹션 -->
    <div id="login-section" class="max-w-md mx-auto my-auto px-4 py-8 w-full">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center">
            <div class="w-12 h-12 bg-cyan-500/10 border border-cyan-500/30 rounded-xl flex items-center justify-center mx-auto mb-4 text-cyan-400 text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-lg font-bold text-white mb-1">관리자 인증</h2>
            <p class="text-xs text-slate-400 mb-6">수행평가 D-Day 관리를 위해 비밀번호를 입력하세요.</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="admin-pass-input" placeholder="비밀번호 입력" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500 text-center">
                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm py-3 rounded-xl transition-all shadow-lg shadow-cyan-500/20">
                    로그인
                </button>
            </form>
        </div>
    </div>

    <!-- 2. 관리자 메인 영역 -->
    <main id="admin-main-section" class="max-w-4xl mx-auto px-4 py-8 w-full flex-1 space-y-6 hidden">

        <!-- A. GitHub 연동 설정 카드 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-brands fa-github"></i> GitHub 연동 설정 (DB 연결)
                </h2>
                <button onclick="toggleGithubConfig()" class="text-xs text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-sliders mr-1"></i> <span>접기/열기</span>
                </button>
            </div>
            
            <div id="github-config-box" class="space-y-4 pt-2">
                <p class="text-xs text-slate-400">
                    GitHub API를 통해 데이터를 원격 수정합니다. 설정 정보는 브라우저에 자동 저장됩니다.
                </p>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                    <div>
                        <label class="block text-slate-400 mb-1">GitHub 아이디 (Owner)</label>
                        <input type="text" id="gh-owner" placeholder="예: github-username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">저장소 이름 (Repo)</label>
                        <input type="text" id="gh-repo" placeholder="예: info-class-2026" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">Personal Access Token</label>
                        <input type="password" id="gh-token" placeholder="ghp_..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    </div>
                </div>
                <button onclick="saveConfig()" class="bg-slate-800 hover:bg-slate-700 text-xs px-4 py-2 rounded-xl text-slate-200 transition-colors">
                    연동 설정 정보 저장하기
                </button>
            </div>
        </div>

        <!-- B. 빠른 이동 카드 ON/OFF 제어 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-sm font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-toggle-on text-cyan-400"></i> 빠른 이동 카드 노출 설정 (ON / OFF)
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                <div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span class="font-semibold text-slate-200">D-Day 카운터</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-dday" class="sr-only peer" checked>
                        <div class="w-9 h-5 bg-slate-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-cyan-500"></div>
                    </label>
                </div>
                <div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span class="font-semibold text-slate-200">코드 스니핏 카드</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-snippet" class="sr-only peer" checked>
                        <div class="w-9 h-5 bg-slate-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-cyan-500"></div>
                    </label>
                </div>
                <div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span class="font-semibold text-slate-200">과제 제출 카드</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-assignment" class="sr-only peer" checked>
                        <div class="w-9 h-5 bg-slate-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-cyan-500"></div>
                    </label>
                </div>
                <div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span class="font-semibold text-slate-200">공지사항 카드</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-notice" class="sr-only peer" checked>
                        <div class="w-9 h-5 bg-slate-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-cyan-500"></div>
                    </label>
                </div>
            </div>
        </div>

        <!-- C. 새 D-Day 추가 폼 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-sm font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-plus text-emerald-400"></i> 새 D-Day 일정 추가
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">일정 제목</label>
                    <input type="text" id="new-title" placeholder="예: 수행평가 2차 제출" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">마감 날짜 (캘린더 선택)</label>
                    <input type="date" id="new-date" onclick="this.showPicker()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-emerald-500 cursor-pointer">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">마감 교시</label>
                    <select id="new-time" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-emerald-500 cursor-pointer">
                        <option value="1교시">1교시 시작 전</option>
                        <option value="2교시">2교시 시작 전</option>
                        <option value="3교시">3교시 시작 전</option>
                        <option value="4교시">4교시 시작 전</option>
                        <option value="5교시">5교시 시작 전</option>
                        <option value="6교시">6교시 시작 전</option>
                        <option value="7교시" selected>7교시 마감 (종례 전)</option>
                        <option value="자율(24시)">자정 (23:59) 마감</option>
                    </select>
                </div>
            </div>
            <button onclick="addDDay()" class="mt-4 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-colors">
                목록에 추가하기
            </button>
        </div>

        <!-- D. D-Day 목록 및 최종 저장 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-cyan-400"></i> 등록된 D-Day 목록
                </h2>
                <button onclick="fetchFromGithub()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300">
                    <i class="fa-solid fa-rotate-right mr-1"></i> GitHub DB에서 불러오기
                </button>
            </div>

            <div id="dday-list-box" class="space-y-2 text-xs">
                <p class="text-slate-500 text-center py-4">GitHub에서 불러오는 중...</p>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-800 flex justify-end">
                <button onclick="commitAllToGithub()" id="save-btn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm px-6 py-3 rounded-xl transition-all shadow-lg shadow-cyan-500/20 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> GitHub DB에 전체 설정 최종 저장
                </button>
            </div>
        </div>

    </main>

    <footer class="border-t border-slate-800 bg-slate-900 py-6 text-center text-xs text-slate-500">
        <p>군포중앙고등학교 정보수업 관리자 페이지</p>
    </footer>

    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white text-xs px-4 py-3 rounded-xl border border-slate-700 shadow-2xl opacity-0 pointer-events-none transition-all duration-300">
        <span id="toast-msg">성공적으로 처리되었습니다.</span>
    </div>

    <script>
        const ADMIN_PASSWORD = "0511";

        let ddays = [];
        let ddaySha = "";
        let settingsSha = "";

        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById('admin-pass-input').value === ADMIN_PASSWORD) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-main-section').classList.remove('hidden');
                initAdmin();
            } else {
                alert("비밀번호가 올바르지 않습니다.");
                document.getElementById('admin-pass-input').value = '';
            }
        }

        function initAdmin() {
            document.getElementById('gh-owner').value = localStorage.getItem('gh_owner') || '';
            document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
            document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';

            if (localStorage.getItem('gh_owner') && localStorage.getItem('gh_repo') && localStorage.getItem('gh_token')) {
                fetchFromGithub();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3000);
        }

        function toggleGithubConfig() {
            document.getElementById('github-config-box').classList.toggle('hidden');
        }

        function saveConfig() {
            localStorage.setItem('gh_owner', document.getElementById('gh-owner').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
            localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
            showToast("GitHub 연동 정보가 저장되었습니다.");
            fetchFromGithub();
        }

        async function fetchFromGithub() {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            if (!owner || !repo || !token) return;

            // 1. ddays.json 로드
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/ddays.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    ddaySha = data.sha;
                    ddays = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                    renderList();
                }
            } catch (err) { console.error(err); }

            // 2. settings.json 로드
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/settings.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    settingsSha = data.sha;
                    const settings = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                    document.getElementById('toggle-dday').checked = settings.card_dday ?? true;
                    document.getElementById('toggle-snippet').checked = settings.card_snippet ?? true;
                    document.getElementById('toggle-assignment').checked = settings.card_assignment ?? true;
                    document.getElementById('toggle-notice').checked = settings.card_notice ?? true;
                }
            } catch (err) { console.error(err); }

            showToast("GitHub DB에서 최신 설정을 불러왔습니다.");
        }

        function renderList() {
            const listBox = document.getElementById('dday-list-box');
            if (!ddays || ddays.length === 0) {
                listBox.innerHTML = `<p class="text-slate-500 text-center py-4">등록된 D-Day 일정이 없습니다.</p>`;
                return;
            }
            listBox.innerHTML = ddays.map((item, index) => `
                <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
                    <div>
                        <span class="font-bold text-white text-sm">${item.title}</span>
                        <span class="text-amber-400 font-semibold text-xs ml-2">[${item.time || '7교시'}]</span>
                        <span class="text-slate-400 text-xs ml-1">(${item.date} 까지)</span>
                    </div>
                    <button onclick="deleteDDay(${index})" class="text-rose-400 hover:text-rose-300 p-1">
                        <i class="fa-solid fa-trash-can"></i> 삭제
                    </button>
                </div>
            `).join('');
        }

        function addDDay() {
            const title = document.getElementById('new-title').value.trim();
            const date = document.getElementById('new-date').value;
            const time = document.getElementById('new-time').value;

            if (!title || !date) { alert("제목과 날짜를 입력해주세요."); return; }
            ddays.push({ title, date, time });
            renderList();
            document.getElementById('new-title').value = '';
            document.getElementById('new-date').value = '';
            showToast("목록에 추가되었습니다. 하단 저장 버튼을 눌러주세요.");
        }

        function deleteDDay(index) {
            ddays.splice(index, 1);
            renderList();
        }

        // 전체 저장 (ddays.json & settings.json)
        async function commitAllToGithub() {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            if (!owner || !repo || !token) { alert("GitHub 연동 설정을 먼저 진행하세요."); return; }

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.innerText = "업로드 중...";

            try {
                // 저장 1: ddays.json
                const ddayBody = {
                    message: "Update ddays.json via Admin",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(ddays, null, 2))))
                };
                if (ddaySha) ddayBody.sha = ddaySha;
                const resDday = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/ddays.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(ddayBody)
                });
                if (resDday.ok) ddaySha = (await resDday.json()).content.sha;

                // 저장 2: settings.json
                const settingsData = {
                    card_dday: document.getElementById('toggle-dday').checked,
                    card_snippet: document.getElementById('toggle-snippet').checked,
                    card_assignment: document.getElementById('toggle-assignment').checked,
                    card_notice: document.getElementById('toggle-notice').checked
                };
                const settingBody = {
                    message: "Update settings.json via Admin",
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(settingsData, null, 2))))
                };
                if (settingsSha) settingBody.sha = settingsSha;
                const resSetting = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/settings.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(settingBody)
                });
                if (resSetting.ok) settingsSha = (await resSetting.json()).content.sha;

                showToast("✅ 성공! GitHub DB에 모든 변경사항이 반영되었습니다.");
            } catch (err) {
                console.error(err);
                alert("저장 중 오류가 발생했습니다.");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> GitHub DB에 전체 설정 최종 저장`;
            }
        }
    </script>
</body>
</html>
