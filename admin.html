<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 설정 - D-Day 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="icon" href="./icon/gpja.png" type="image/png">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- 1. 비밀번호 입력 인증 폼 -->
    <div id="auth-box" class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-amber-500/10 border border-amber-500/30 text-amber-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-xl font-bold text-white">관리자 인증</h2>
            <p class="text-xs text-slate-400 mt-1">D-Day 설정을 변경하려면 비밀번호를 입력하세요.</p>
        </div>

        <form id="auth-form" onsubmit="checkAuth(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">비밀번호</label>
                <input type="password" id="admin-password" placeholder="비밀번호 입력 (기본: 1234)" 
                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 transition-colors">
            </div>
            <p id="auth-error" class="text-xs text-red-400 hidden"><i class="fa-solid fa-circle-exclamation mr-1"></i>비밀번호가 올바르지 않습니다.</p>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-amber-500/10 text-sm">
                접속하기
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <a href="./index.html" class="text-xs text-slate-500 hover:text-slate-400"><i class="fa-solid fa-arrow-left mr-1"></i>메인으로 돌아가기</a>
        </div>
    </div>

    <!-- 2. D-Day 설정 대시보드 (인증 성공 시 표시) -->
    <div id="admin-panel" class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl hidden">
        <div class="flex items-center justify-between mb-6 border-b border-slate-800 pb-4">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-sliders text-amber-400"></i>
                <h2 class="text-lg font-bold text-white">D-Day 설정 관리</h2>
            </div>
            <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition-colors">
                로그아웃
            </button>
        </div>

        <form onsubmit="saveDDay(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">과제 / 일정 제목</label>
                <input type="text" id="input-title" required placeholder="예: 수행평가 과제 3-2 제출 마감" 
                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">마감 날짜 선택</label>
                <input type="date" id="input-date" required 
                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 transition-colors">
            </div>

            <div class="pt-2 flex gap-3">
                <a href="./index.html" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl transition-all text-center text-sm">
                    취소
                </a>
                <button type="submit" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-amber-500/10 text-sm">
                    저장하기
                </button>
            </div>
        </form>
    </div>

    <script>
        const ADMIN_PW = "1234"; // 비밀번호 변경 원할 시 이 값을 수정하세요

        function checkAuth(e) {
            e.preventDefault();
            const inputPw = document.getElementById('admin-password').value;
            if (inputPw === ADMIN_PW) {
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadCurrentSettings();
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
            }
        }

        function loadCurrentSettings() {
            document.getElementById('input-title').value = localStorage.getItem('dday_title') || '수행평가 과제 제출 마감';
            document.getElementById('input-date').value = localStorage.getItem('dday_date') || '2026-09-15';
        }

        function saveDDay(e) {
            e.preventDefault();
            const title = document.getElementById('input-title').value;
            const date = document.getElementById('input-date').value;

            localStorage.setItem('dday_title', title);
            localStorage.setItem('dday_date', date);

            alert('D-Day 설정이 저장되었습니다!');
            window.location.href = './index.html';
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
